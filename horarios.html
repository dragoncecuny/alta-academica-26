<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐉 CECUNY · Horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-color: #8c7a5f;
            background-image: url('https://images.unsplash.com/photo-1580587771525-78b9dba3b914?q=80&w=1974&auto=format&fit=crop');
            background-size: cover;
            background-attachment: fixed;
            background-blend-mode: multiply;
            background-color: #5a4a33;
        }
        .container {
            max-width: 1400px;
            width: 100%;
            background: rgba(235, 218, 190, 0.88);
            backdrop-filter: blur(3px);
            border-radius: 40px 40px 20px 20px;
            padding: 35px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.6);
            border: 8px solid #b39b7c;
            border-top-color: #d4c5a9;
            border-left-color: #c4b09a;
            position: relative;
        }
        /* === DECORACIONES DE CÓDICE === */
        .container::before {
            content: "🐉";
            position: absolute;
            top: -15px;
            left: -15px;
            font-size: 3.5rem;
            opacity: 0.15;
            transform: rotate(-15deg);
        }
        .container::after {
            content: "📅";
            position: absolute;
            bottom: -10px;
            right: -10px;
            font-size: 3rem;
            opacity: 0.15;
            transform: rotate(10deg);
        }
        /* === HEADER Y MENÚ === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 3px solid #8c7a5f;
            padding-bottom: 20px;
        }
        .header-titulo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header-titulo .dragon-icon {
            font-size: 3rem;
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }
        .header-titulo h1 {
            font-family: 'Crimson Text', serif;
            font-size: 2rem;
            font-weight: 700;
            color: #3c2a1e;
            line-height: 1.2;
        }
        .header-titulo h1 span {
            font-weight: 400;
            font-style: italic;
            color: #5a3f2b;
            font-size: 1.1rem;
            display: block;
        }
        .header-derecha {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .badge {
            background: #8c7a5f;
            color: #f5efe6;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #5a3f2b;
        }
        .btn-refresh {
            background: #3c2a1e;
            color: #f5efe6;
            border: 2px solid #5a3f2b;
            padding: 10px 22px;
            border-radius: 40px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            box-shadow: 0 4px 0 #1f140e;
        }
        .btn-refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #1f140e;
            background: #5a3f2b;
        }
        .menu {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .menu a {
            font-family: 'Crimson Text', serif;
            color: #3c2a1e;
            text-decoration: none;
            font-weight: 600;
            padding: 6px 20px;
            border-radius: 40px;
            background: rgba(140, 122, 95, 0.2);
            border: 1px solid transparent;
            transition: 0.2s;
            font-size: 1rem;
        }
        .menu a:hover {
            background: rgba(140, 122, 95, 0.4);
            border-color: #8c7a5f;
        }
        .menu a.activo {
            background: #3c2a1e;
            color: #f5efe6;
            border-color: #3c2a1e;
            box-shadow: 0 4px 0 #1f140e;
        }
        /* === FILTROS === */
        .filters {
            background: rgba(245, 239, 230, 0.8);
            backdrop-filter: blur(4px);
            padding: 16px 24px;
            border-radius: 60px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid #b39b7c;
        }
        .filters input {
            padding: 10px 20px;
            border: 2px solid #b39b7c;
            border-radius: 40px;
            font-size: 0.9rem;
            background: rgba(255, 252, 245, 0.8);
            outline: none;
            font-family: 'Inter', sans-serif;
            color: #3c2a1e;
            flex: 1;
            min-width: 180px;
        }
        .filters input:focus {
            border-color: #3c2a1e;
            box-shadow: 0 0 0 4px rgba(60, 42, 30, 0.1);
        }
        /* === TARJETAS DE DOCENTES === */
        .grid-docentes {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }
        .card-docente {
            background: rgba(255, 252, 245, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 30px 30px 16px 16px;
            padding: 24px;
            box-shadow: 0 8px 0 #8c7a5f, 0 10px 20px rgba(0,0,0,0.1);
            border: 1px solid #b39b7c;
            transition: 0.2s;
            position: relative;
        }
        .card-docente::before {
            content: "📅";
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 2.2rem;
            opacity: 0.08;
            transform: rotate(-10deg);
        }
        .card-docente:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 0 #8c7a5f, 0 20px 30px rgba(0,0,0,0.15);
        }
        .card-docente .nombre-docente {
            font-family: 'Crimson Text', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #3c2a1e;
            padding-bottom: 14px;
            border-bottom: 3px dashed #b39b7c;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card-docente .nombre-docente .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #3c2a1e;
            color: #f5efe6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            flex-shrink: 0;
            font-family: 'Crimson Text', serif;
            border: 2px solid #8c7a5f;
        }
        .tabla-horario {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
        }
        .tabla-horario th {
            text-align: left;
            padding: 8px 6px 6px 6px;
            color: #5a3f2b;
            font-weight: 700;
            border-bottom: 2px solid #b39b7c;
            font-family: 'Crimson Text', serif;
            font-size: 0.95rem;
        }
        .tabla-horario td {
            padding: 6px;
            border-bottom: 1px solid #d4c5a9;
            color: #3c2a1e;
        }
        .tabla-horario tr:last-child td {
            border-bottom: none;
        }
        .badge-dia {
            background: #8c7a5f;
            color: #f5efe6;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            display: inline-block;
            font-family: 'Inter', sans-serif;
        }
        /* === LOADING Y EMPTY === */
        #loading {
            text-align: center;
            padding: 80px 20px;
            background: rgba(245, 239, 230, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            font-size: 1.1rem;
            color: #3c2a1e;
            font-weight: 700;
            border: 2px dashed #8c7a5f;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: rgba(245, 239, 230, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            grid-column: 1 / -1;
            border: 2px dashed #8c7a5f;
        }
        .empty-state .emoji { font-size: 4rem; display: block; margin-bottom: 12px; }
        .empty-state h3 { font-family: 'Crimson Text', serif; color: #3c2a1e; margin-bottom: 6px; }
        .empty-state p { color: #5a3f2b; }
        @media (max-width: 640px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header-titulo h1 { font-size: 1.6rem; }
            .grid-docentes { grid-template-columns: 1fr; }
            .filters { flex-direction: column; border-radius: 30px; }
            .filters input { width: 100%; }
            .tabla-horario { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-titulo">
            <span class="dragon-icon">🐉</span>
            <div>
                <h1>CECUNY <span>Dragones que generan cultura</span></h1>
                <div class="menu">
                    <a href="/alta-academica-26/">📜 Logros</a>
                    <a href="/alta-academica-26/horarios.html" class="activo">📅 Horarios</a>
                </div>
            </div>
        </div>
        <div class="header-derecha">
            <span class="badge">🔄 Actualizado: <strong id="updateTime">cargando...</strong></span>
            <button class="btn-refresh" onclick="cargarHorarios()">⟳ Actualizar</button>
        </div>
    </div>

    <!-- FILTRO -->
    <div class="filters">
        <label for="buscador" style="font-weight:700;color:#3c2a1e;">🔍 Buscar docente:</label>
        <input type="text" id="buscador" placeholder="Nombre del docente...">
    </div>

    <!-- CONTENIDO -->
    <div id="loading">⏳ Cargando horarios...</div>
    <div id="contenedorHorarios" style="display: none;">
        <div class="grid-docentes" id="gridHorarios"></div>
    </div>
</div>

<script>
    // ================================================================
    //  CONFIGURACIÓN: Enlaces a las tres hojas CSV
    // ================================================================
    const URLS_HORARIOS = {
        "Lunes y Miércoles": "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqg7pVNQKX1ZocH1JiCy1ruB1v39xT1wdsRz1yUy42gfCRkhrejdWnx_Uf5NStBfuxO4z42q4gMXUm/pub?gid=0&single=true&output=csv",
        "Martes y Jueves": "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqg7pVNQKX1ZocH1JiCy1ruB1v39xT1wdsRz1yUy42gfCRkhrejdWnx_Uf5NStBfuxO4z42q4gMXUm/pub?gid=1711929526&single=true&output=csv",
        "Viernes": "https://docs.google.com/spreadsheets/d/e/2PACX-1vQqg7pVNQKX1ZocH1JiCy1ruB1v39xT1wdsRz1yUy42gfCRkhrejdWnx_Uf5NStBfuxO4z42q4gMXUm/pub?gid=1049689652&single=true&output=csv"
    };

    let todosLosHorarios = [];
    const loadingDiv = document.getElementById('loading');
    const contenedorHorarios = document.getElementById('contenedorHorarios');
    const gridHorarios = document.getElementById('gridHorarios');
    const buscador = document.getElementById('buscador');
    const updateTimeSpan = document.getElementById('updateTime');

    // Función para parsear CSV
    function parseCSV(csvText) {
        const lines = csvText.split(/\r\n|\n/);
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h => h.trim());
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const values = lines[i].split(',').map(v => v.trim());
            const obj = {};
            headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
            result.push(obj);
        }
        return result;
    }

    // Función para limpiar claves de grupo (ej: "DAN01" → "DAN")
    function limpiarClaveGrupo(texto) {
        if (!texto) return '';
        return texto.replace(/[0-9]/g, '').trim();
    }

    // Cargar datos de todas las hojas
    async function cargarHorarios() {
        try {
            loadingDiv.style.display = 'block';
            contenedorHorarios.style.display = 'none';
            loadingDiv.innerHTML = '⏳ Cargando horarios...';

            const horariosPorDocente = {};

            for (const [bloqueDias, url] of Object.entries(URLS_HORARIOS)) {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Error al cargar ${bloqueDias}`);
                const csvText = await response.text();
                const datos = parseCSV(csvText);
                if (datos.length === 0) continue;

                const headers = Object.keys(datos[0]);
                const docentes = headers.slice(1);

                datos.forEach(fila => {
                    const hora = fila['Hora'] || '';
                    if (!hora) return;

                    docentes.forEach(docente => {
                        const claveGrupo = fila[docente] || '';
                        if (!claveGrupo || claveGrupo === '—' || claveGrupo === '-') return;

                        if (!horariosPorDocente[docente]) {
                            horariosPorDocente[docente] = [];
                        }

                        horariosPorDocente[docente].push({
                            dia: bloqueDias,
                            hora: hora,
                            grupo: claveGrupo,
                            materia: limpiarClaveGrupo(claveGrupo)
                        });
                    });
                });
            }

            todosLosHorarios = Object.entries(horariosPorDocente).map(([docente, clases]) => ({
                docente: docente,
                clases: clases
            }));

            todosLosHorarios.sort((a, b) => a.docente.localeCompare(b.docente));

            if (todosLosHorarios.length === 0) throw new Error('No se encontraron horarios.');

            renderHorarios(todosLosHorarios);
            updateTimeSpan.textContent = new Date().toLocaleString('es-ES', { dateStyle: 'medium', timeStyle: 'short' });
            loadingDiv.style.display = 'none';
            contenedorHorarios.style.display = 'block';

        } catch (error) {
            loadingDiv.innerHTML = `<div class="empty-state"><span class="emoji">❌</span><h3>Error al cargar horarios</h3><p style="color:#7a1f1f;">${error.message}</p><br><button onclick="cargarHorarios()" style="padding:10px 30px; border-radius:30px; border:none; background:#3c2a1e; color:#f5efe6; font-weight:600; cursor:pointer;">🔄 Reintentar</button></div>`;
        }
    }

    // Renderizar horarios
    function renderHorarios(horarios) {
        const terminoBusqueda = buscador.value.toLowerCase().trim();
        let filtrados = horarios.filter(item =>
            item.docente.toLowerCase().includes(terminoBusqueda)
        );

        if (filtrados.length === 0) {
            gridHorarios.innerHTML = `<div class="empty-state"><span class="emoji">🔍</span><h3>No se encontraron docentes</h3><p>Intenta con otro nombre.</p></div>`;
            return;
        }

        let html = '';
        filtrados.forEach(item => {
            const inicial = item.docente.charAt(0).toUpperCase();
            const clasesOrdenadas = item.clases.sort((a, b) => {
                const ordenDias = { 'Lunes y Miércoles': 1, 'Martes y Jueves': 2, 'Viernes': 3 };
                return (ordenDias[a.dia] || 99) - (ordenDias[b.dia] || 99);
            });

            html += `<div class="card-docente">
                <div class="nombre-docente">
                    <span class="avatar">${inicial}</span>
                    ${item.docente}
                </div>
                <table class="tabla-horario">
                    <thead>
                        <tr><th>Día</th><th>Hora</th><th>Grupo</th></tr>
                    </thead>
                    <tbody>`;

            clasesOrdenadas.forEach(clase => {
                html += `<tr>
                    <td><span class="badge-dia">${clase.dia}</span></td>
                    <td>${clase.hora}</td>
                    <td>${clase.grupo}</td>
                </tr>`;
            });

            html += `</tbody></table></div>`;
        });

        gridHorarios.innerHTML = html;
    }

    buscador.addEventListener('input', () => renderHorarios(todosLosHorarios));
    cargarHorarios();
</script>
</body>
</html>
